name: iOS Build

# Builds the Actifit app for the iOS Simulator on a macOS runner.
# Triggered on push to main and manually via the Actions tab.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcode-select -p
          ruby --version
          pod --version || true

      # The real Secrets.swift / GoogleService-Info.plist are gitignored.
      # Secrets.swift placeholders compile fine. For GoogleService-Info.plist we
      # write a *well-formed dummy* (valid GOOGLE_APP_ID format etc.) because
      # FirebaseApp.configure() format-validates at launch and aborts the app on
      # malformed values like "YOUR_GOOGLE_APP_ID". These dummies are not real and
      # connect to nothing; Firebase network calls just fail silently at runtime.
      - name: Materialize secret files (compile placeholders + launchable dummy Firebase)
        run: |
          cp "Actifit/Structs/Secrets.example.swift" "Actifit/Structs/Secrets.swift"
          cat > "Actifit/GoogleService-Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMY000</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.Actifit.fitnesstracker</string>
            <key>PROJECT_ID</key>
            <string>actifit-ci-dummy</string>
            <key>STORAGE_BUCKET</key>
            <string>actifit-ci-dummy.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false></false>
            <key>IS_ANALYTICS_ENABLED</key>
            <false></false>
            <key>IS_APPINVITE_ENABLED</key>
            <false></false>
            <key>IS_GCM_ENABLED</key>
            <true></true>
            <key>IS_SIGNIN_ENABLED</key>
            <false></false>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
            <key>DATABASE_URL</key>
            <string>https://actifit-ci-dummy.firebaseio.com</string>
          </dict>
          </plist>
          PLIST
          echo "Wrote Secrets.swift and a launchable dummy GoogleService-Info.plist"

      - name: Install CocoaPods 1.15.2 (matches Podfile.lock)
        run: |
          sudo gem install cocoapods -v 1.15.2 --no-document
          pod _1.15.2_ --version

      # The committed Pods/ is incomplete (Realm's core xcframework binaries are
      # gitignored) and was committed from Windows (no +x on scripts). Remove it
      # so pod install does a clean, complete install on the macOS runner.
      - name: Clean install CocoaPods dependencies
        run: |
          rm -rf Pods
          pod _1.15.2_ install --repo-update

      # Safety: ensure all CocoaPods build-phase scripts are executable.
      - name: Fix Pods script permissions
        run: |
          find Pods -name "*.sh" -exec chmod +x {} +

      - name: Generate UI test target
        run: ruby ci_scripts/add_uitest_target.rb

      - name: Create and boot simulator
        id: sim
        run: |
          RUNTIME=$(xcrun simctl list runtimes available | grep -oE "com.apple.CoreSimulator.SimRuntime.iOS[^ ]*" | tail -1)
          echo "Runtime: $RUNTIME"
          DEVICE=$(xcrun simctl create "ci-iphone" "iPhone 15" "$RUNTIME")
          echo "device=$DEVICE" >> "$GITHUB_OUTPUT"
          echo "Device UDID: $DEVICE"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          # Pre-grant photo access to reduce the launch permission prompt.
          xcrun simctl privacy "$DEVICE" grant photos com.Actifit.fitnesstracker || true

      - name: Run UI login test
        env:
          TEST_RUNNER_ACTIFIT_USER: ${{ secrets.ACTIFIT_TEST_USER }}
          TEST_RUNNER_ACTIFIT_KEY: ${{ secrets.ACTIFIT_TEST_KEY }}
        run: |
          set -o pipefail
          xcodebuild test \
            -workspace Actifit.xcworkspace \
            -scheme Actifit \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.device }}" \
            -only-testing:ActifitUITests \
            -resultBundlePath result.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            | tee xcodebuild-test.log

      - name: Extract screenshots and logs
        if: always()
        run: |
          mkdir -p artifacts
          brew install chargepoint/xcparse/xcparse || true
          if command -v xcparse >/dev/null 2>&1 && [ -d result.xcresult ]; then
            xcparse screenshots result.xcresult artifacts/screens || true
          fi
          # Fallback raw screenshot of the simulator's final state.
          xcrun simctl io "${{ steps.sim.outputs.device }}" screenshot artifacts/final-state.png || true
          cp -R ~/Library/Logs/DiagnosticReports artifacts/CrashReports 2>/dev/null || true
          ls -R artifacts || true

      - name: Upload run artifacts (screenshot + any crash logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-run
          path: artifacts
          if-no-files-found: ignore
