name: iOS Build

# Builds the Actifit app for the iOS Simulator on a macOS runner.
# Triggered on push to main and manually via the Actions tab.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcode-select -p
          ruby --version
          pod --version || true

      # The real Secrets.swift / GoogleService-Info.plist are gitignored.
      # Secrets.swift placeholders compile fine. For GoogleService-Info.plist we
      # write a *well-formed dummy* (valid GOOGLE_APP_ID format etc.) because
      # FirebaseApp.configure() format-validates at launch and aborts the app on
      # malformed values like "YOUR_GOOGLE_APP_ID". These dummies are not real and
      # connect to nothing; Firebase network calls just fail silently at runtime.
      - name: Materialize secret files (compile placeholders + launchable dummy Firebase)
        run: |
          cp "Actifit/Structs/Secrets.example.swift" "Actifit/Structs/Secrets.swift"
          cat > "Actifit/GoogleService-Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>API_KEY</key>
            <string>AIzaSyDUMMYDUMMYDUMMYDUMMYDUMMYDUMMY000</string>
            <key>GCM_SENDER_ID</key>
            <string>000000000000</string>
            <key>PLIST_VERSION</key>
            <string>1</string>
            <key>BUNDLE_ID</key>
            <string>com.Actifit.fitnesstracker</string>
            <key>PROJECT_ID</key>
            <string>actifit-ci-dummy</string>
            <key>STORAGE_BUCKET</key>
            <string>actifit-ci-dummy.appspot.com</string>
            <key>IS_ADS_ENABLED</key>
            <false></false>
            <key>IS_ANALYTICS_ENABLED</key>
            <false></false>
            <key>IS_APPINVITE_ENABLED</key>
            <false></false>
            <key>IS_GCM_ENABLED</key>
            <true></true>
            <key>IS_SIGNIN_ENABLED</key>
            <false></false>
            <key>GOOGLE_APP_ID</key>
            <string>1:000000000000:ios:0000000000000000</string>
            <key>DATABASE_URL</key>
            <string>https://actifit-ci-dummy.firebaseio.com</string>
          </dict>
          </plist>
          PLIST
          echo "Wrote Secrets.swift and a launchable dummy GoogleService-Info.plist"

      - name: Install CocoaPods 1.15.2 (matches Podfile.lock)
        run: |
          sudo gem install cocoapods -v 1.15.2 --no-document
          pod _1.15.2_ --version

      # The committed Pods/ is incomplete (Realm's core xcframework binaries are
      # gitignored) and was committed from Windows (no +x on scripts). Remove it
      # so pod install does a clean, complete install on the macOS runner.
      - name: Clean install CocoaPods dependencies
        run: |
          rm -rf Pods
          pod _1.15.2_ install --repo-update

      # Safety: ensure all CocoaPods build-phase scripts are executable.
      - name: Fix Pods script permissions
        run: |
          find Pods -name "*.sh" -exec chmod +x {} +

      - name: Build (compile check)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Actifit.xcworkspace \
            -scheme Actifit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee xcodebuild.log
