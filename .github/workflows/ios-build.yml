name: iOS Build

# Builds the Actifit app for the iOS Simulator on a macOS runner.
# Triggered on push to main and manually via the Actions tab.
on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:

jobs:
  build:
    name: Build (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15.4
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcode-select -p
          ruby --version
          pod --version || true

      # The real Secrets.swift / GoogleService-Info.plist are gitignored.
      # For a compile check, placeholder values from the committed templates
      # are sufficient (real values are only needed at runtime).
      - name: Materialize secret files from templates (placeholders)
        run: |
          cp "Actifit/Structs/Secrets.example.swift" "Actifit/Structs/Secrets.swift"
          cp "Actifit/GoogleService-Info.sample.plist" "Actifit/GoogleService-Info.plist"
          echo "Created placeholder Secrets.swift and GoogleService-Info.plist"

      - name: Install CocoaPods 1.15.2 (matches Podfile.lock)
        run: |
          sudo gem install cocoapods -v 1.15.2 --no-document
          pod _1.15.2_ --version

      # The committed Pods/ is incomplete (Realm's core xcframework binaries are
      # gitignored) and was committed from Windows (no +x on scripts). Remove it
      # so pod install does a clean, complete install on the macOS runner.
      - name: Clean install CocoaPods dependencies
        run: |
          rm -rf Pods
          pod _1.15.2_ install --repo-update

      # Safety: ensure all CocoaPods build-phase scripts are executable.
      - name: Fix Pods script permissions
        run: |
          find Pods -name "*.sh" -exec chmod +x {} +

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild \
            -workspace Actifit.xcworkspace \
            -scheme Actifit \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            clean build
